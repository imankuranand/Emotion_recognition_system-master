# AFFECTRA — backend API on Render (Docker).
# The frontend deploys separately on Vercel (root directory: frontend).
services:
  - type: web
    name: affectra-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      # Set your frontend's exact origin(s), comma separated, e.g.
      #   https://affectra.vercel.app,http://localhost:3000
      - key: ALLOWED_ORIGINS
        sync: false
      # Model ships inside the image; MODEL_URL is only a fallback.
      - key: MODEL_URL
        value: https://huggingface.co/onnxmodelzoo/emotion-ferplus-8/resolve/main/emotion-ferplus-8.onnx
